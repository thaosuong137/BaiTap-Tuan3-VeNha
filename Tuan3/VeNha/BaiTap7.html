
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài tập 7 - CSS Layout</title>
    <style>
        #wrapper {
            width: 240px;
            margin: 40px auto;
            padding: 6px;
            border: 2px solid black;
            box-shadow: -12px 12px 15px #aaa;
            font-family: Arial, sans-serif;
            font-size: 16px;

            display: grid;
            grid-template-columns: 45px 1fr;
            grid-template-rows: 45px 180px 30px;
            gap: 5px;
        }

        header, nav, main, footer {
            border: 2px solid black;
            padding: 4px;
            box-sizing: border-box;
        }

        header {
            grid-column: 1 / 3;
        }

        nav {
            grid-column: 1;
            grid-row: 2;
        }

        main {
            grid-column: 2;
            grid-row: 2;
        }

        footer {
            grid-column: 1 / 3;
        }
    </style>
</head>

<body>
    <div id="wrapper">
        <header>header</header>
        <nav>nav</nav>
        <main>main</main>
        <footer>footer</footer>
    </div>
</body>
</html>
