<!doctype html>

<title>Học web chuẩn</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
    }

    .portfolio {
        width: 900px;
        margin: 30px auto;
        text-align: center;
    }

    .portfolio h2 {
        background-color: #f7f7f7;
        color: #333;
        font-size: 26px;
        font-weight: bold;
        margin: 0;
        padding: 30px 0 15px;
    }
    .portfolio h2::after {
        content: "";
        display: block;
        width: 60px;
        height: 2px;
        background-color: #5bc0be;
        margin: 15px auto 0;
    }

    .list-tab {
        list-style: none;
        background-color: #f7f7f7;
        margin: 0;
        padding: 10px 0 30px;
    }

    .list-tab li {
        display: inline-block;
        margin: 0 8px;
    }

    .list-tab a {
        color: #555;
        font-size: 13px;
        font-weight: bold;
        text-decoration: none;
    }

    .list-tab li:first-child a {
        color: #5bc0be;
    }

    .list-tab a:hover {
        color: #5bc0be;
    }

.galerry {
    list-style: none;
    margin: 10px 0 0;
    padding: 0;
    font-size: 0;
}

.galerry li {
    display: inline-block;
    width: 31%;
    margin: 0 1% 15px;
    vertical-align: top;
    position: relative;
    background-color: #99c978;
    height: 210px;
}

.galerry li:nth-child(n+4) {
    display: none;
}

.galerry img {
    display: none;
}

.galerry li::after {
    content: "Hoc Web Chuẩn";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #e5f2d9;
    font-family: Arial, sans-serif;
    font-size: 20px;
    white-space: nowrap;
}

</style>
