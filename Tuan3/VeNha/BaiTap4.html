
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập 4 - CSS Menu</title>

    <style>
    
.menu {
    list-style-type: none;
    margin: 0;
    padding: 0;
}

.menu li {
    display: inline-block;
    background-color: cyan;
    width: 106px;
    text-align: center;
    margin-right: 5px;
}

.menu li a {
    display: block;
    color: blue;
    font-family: "Times New Roman", serif;
    font-size: 24px;
    text-decoration: underline;
}
    </style>
</head>
<body>

    <ul class="menu">
        <li><a href="#">TMDT</a></li>
        <li><a href="#">ERP</a></li>
        <li><a href="#">MIS</a></li>
        <li><a href="#">DS</a></li>
    </ul>

</body>
</html>
